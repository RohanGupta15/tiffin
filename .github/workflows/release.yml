# Push a tag like v2.1.0 (matching manifest.json) to test, sign and submit the new
# version to addons.mozilla.org, and attach the package to a GitHub release.
# Needs repo secrets AMO_JWT_ISSUER and AMO_JWT_SECRET (AMO developer hub → API keys).
# The first listing is submitted by hand on AMO; this handles every version after it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tag matches manifest version
        run: test "v$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"

      - run: npm test

      - run: npx web-ext lint --warnings-as-errors

      - run: npm run build

      - name: Submit to addons.mozilla.org
        run: npx web-ext sign --channel listed --approval-timeout 0 --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" web-ext-artifacts/*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
