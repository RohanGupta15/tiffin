# Every merge to master tests Tiffin, picks the next version from the commit titles since the
# last v* tag (see scripts/next-version.mjs), builds the Firefox and Chrome/Edge zips with it,
# and publishes both as a GitHub release. The version lives in the tags: manifest.json is only
# updated inside the build, so nothing is committed back and dev never falls behind master.
# Store uploads stay manual: AMO takes the Firefox zip, Chrome Web Store and Edge the Chrome zip.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# Two quick merges must not both claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history, to pick the version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Pick the version
        id: version
        run: echo "version=$(node scripts/next-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Write it into the manifest
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          node -e "const f='manifest.json',fs=require('fs'),m=JSON.parse(fs.readFileSync(f));m.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(m,null,'\t')+'\n')" "${{ steps.version.outputs.version }}"

      - run: npx web-ext lint --warnings-as-errors

      - run: npm run build

      - run: npm run build:chrome

      - name: GitHub release
        run: |
          v="${{ steps.version.outputs.version }}"
          gh release create "v$v" --target "$GITHUB_SHA" --title "Tiffin $v" --generate-notes \
            "web-ext-artifacts/tiffin-firefox-$v.zip#Firefox (upload to addons.mozilla.org)" \
            "web-ext-artifacts/tiffin-chrome-$v.zip#Chrome and Edge (upload to the store, or unzip and Load unpacked)"
        env:
          GH_TOKEN: ${{ github.token }}
